name: Automated Daily Job Sync

on:
  schedule:
    # Run daily at 06:00 UTC (11:30 AM IST / 02:00 AM EDT)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from the Actions tab anytime

permissions:
  contents: write

concurrency:
  group: 'job-sync'
  cancel-in-progress: true

jobs:
  sync-jobs:
    name: Sync Developer Jobs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Job Sync Script
        run: npm run sync:jobs

      - name: Commit & Push Changes
        run: |
          if [ -n "$(git status --porcelain src/data/jobs.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/jobs.json
            git commit -m "chore(jobs): automated daily sync"
            git push origin main
            echo "Successfully committed and pushed updated jobs.json"
          else
            echo "No job changes detected today. Repository is already up to date."
          fi
