services:
  - type: web
    name: devscrolls-blog-automation
    runtime: python
    region: singapore
    plan: free
    branch: main
    rootDir: blog-automation-backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: BASE_BLOG_URL
        value: https://devscrolls.dev
      - key: DEFAULT_AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_TRANSCRIPTION_MODEL
        value: gemini-3.5-flash-lite
      - key: GITHUB_REPO_OWNER
        value: arcinterface-dev
      - key: GITHUB_REPO_NAME
        value: devscrolls
      - key: GITHUB_BRANCH
        value: main
      # Secrets to be provided in the Render Dashboard
      - key: INTERNAL_API_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: AUTHORIZED_TELEGRAM_USER_IDS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
